<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Régate CVBS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- LOGO CLUB -->
  <div id="logoBar">
    <img src="images/logo.jpg" alt="Logo CVBS">
    <span>Régate CVBS</span>
    <img src="images/logo.jpg" alt="Logo CVBS">
  </div>

  <!-- HEADER -->
  <div id="header">⛵ Paramétrage Régate ⛵</div>

  <!-- STATUS -->
  <div id="status">...</div>

  <!-- FANIONS -->
  <div id="flags"></div>

  <!-- COUNTDOWN -->
  <div id="countdown"></div>

  <!-- HEURE DEPART -->
  <div id="startTimeDisplay"></div>

  <!-- ===================== -->
  <!-- PARAMETRES -->
  <!-- ===================== -->
  <div id="setup" class="panel">

    <h2>⚙️ Paramètres</h2>

    <label>Fanion préparatoire</label>
    <select id="prepFlag">
      <option value="P" selected>P — Standard</option>
      <option value="I">I — Règle 30.1</option>
      <option value="U">U — Règle 30.3</option>
      <option value="BLACK">Noir — Règle 30.4</option>
    </select>

    <label>Ouverture → Procédure (min)</label>
    <input type="number" id="openToProcedure" value="1" min="0" max="60">

    <label>Temps limite arrivée (min)</label>
    <input type="number" id="finishLimit" value="20" min="1" max="120">

  </div>

  <!-- ===================== -->
  <!-- OUVERTURE -->
  <!-- ===================== -->
  <button id="openBtn" onclick="openLine()">
    🚩 Ouvrir la ligne
  </button>
 <!-- ===================== -->
  <!-- APERÇU avant ouverture de ligne-->
  <!-- ===================== -->
  <button
    id="btnApercuAvt"
    class="btn-warning"
    onclick="sendApercuAvt()"
   
  >
    ⚓ Aperçu — Retard ouverture de ligne
  </button>

  <!-- APERÇU -->
  <!-- ===================== -->
  <button
    id="btnApercu"
    class="btn-warning"
    onclick="sendApercu()"
    style="display:none;"
  >
    ⚓ Aperçu — Retard de départ
  </button>

  <!-- ===================== -->
  <!-- AFFALÉE -->
  <!-- ===================== -->
  <button
    id="btnAffalee"
    class="btn-warning"
    onclick="affaleeAction()"
    style="display:none;"
  >
    🔽 Descendre le pavillon
  </button>

  <!-- ===================== -->
  <!-- BOUTONS COURSE -->
  <!-- ===================== -->
  <div id="raceBtns" style="display:none;">

    <button id="btnRecallInd" onclick="recallIndividual()">
      🚩 Rappel individuel
    </button>

    <button
      id="btnCancelRecallInd"
      class="btn-success"
      onclick="cancelRecallIndividual()"
      style="display:none;"
    >
      ✅ Retirer rappel individuel
    </button>

    <button id="btnRecallGen" onclick="recallGeneral()">
      🚨 Rappel général
    </button>
     <button
      id="btnReduc"
      class="btn-reduc"
      onclick="reducRace()"
      style="display:none;"
    >
      🔽 Réduction parcours 🏁
    </button>

    <button
      id="btnFinish"
      class="btn-finish"
      onclick="finishRace()"
      style="display:none;"
    >
      🏁 Arrivée
    </button>

    <button
      id="btnRestart"
      class="btn-warning"
      onclick="restartProcedure()"
      style="display:none;"
    >
      🔄 Relancer une procédure
    </button>

  </div>

  <!-- ===================== -->
  <!-- ARRIVEES -->
  <!-- ===================== -->
  <div id="finishList"></div>

  <!-- ===================== -->
  <!-- MENU OPTIONS -->
  <!-- ===================== -->
  <button
    id="btnOptions"
    class="btn-secondary"
    onclick="cancelAll()"
    style="display:none;"
  >
    ⚙️ Options / Annuler
  </button>

  <!-- ===================== -->
  <!-- MENU ANNULATION -->
  <!-- ===================== -->
  <div
    id="cancelMenu"
    class="panel panel-danger"
    style="display:none;"
  >

    <h2>⚙️ Options</h2>

    <!-- Retour paramètres -->
    <button
      class="btn-secondary"
      onclick="goToSetup()"
    >
      🏠 Retour aux paramètres
    </button>

    <!-- N seul -->
    <button
      class="btn-danger"
      onclick="cancelRaceN()"
    >
      🚫 Annuler la course (N)
    </button>

    <!-- N sur H -->
    <button
      class="btn-danger"
      onclick="cancelRaceNH()"
    >
      🏠 Annuler et retour à terre (N/H)
    </button>

    <!-- N sur A -->
    <button
      class="btn-danger"
      onclick="endRegattaNA()"
    >
      🏴 Terminer la régate (N/A)
    </button>

    <!-- Relancer -->
    <button
      id="menuRelancerCourse"
      class="btn-warning"
      onclick="relancerCourse()"
      style="display:none;"
    >
      🔄 Relancer une course (repart de zéro)
    </button>

    <!-- Fermer -->
    <button
      class="btn-secondary"
      onclick="hideCancelMenu()"
    >
      ↩️ Fermer ce menu
    </button>

  </div>

  <!-- FOOTER -->
  <div id="footer">
    Développé par <strong>Sébastien RABAUD</strong> — CVBS © 2026
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
