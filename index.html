<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Régate CBVS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div id="header">⛵ Paramétrage Régate ⛵</div>

  <!-- STATUS CONNEXION -->
  <div id="status">...</div>

  <!-- FANIONS -->
  <div id="flags"></div>

  <!-- COUNTDOWN -->
  <div id="countdown"></div>

  <!-- HEURE DÉPART OFFICIEL -->
  <div id="startTimeDisplay"></div>

  <!-- ===================== -->
  <!-- SETUP : Paramètres    -->
  <!-- ===================== -->
  <div id="setup" class="panel">
    <h2>⚙️ Paramètres</h2>

    <label>Fanion préparatoire</label>
    <select id="prepFlag">
      <option value="P" selected>P — Standard</option>
      <option value="I">I — Règle 30.1</option>
      <option value="U">U — Règle 30.3</option>
      <option value="BLACK">Noir — Règle 30.4</option>
    </select>

    <label>Ouverture → Procédure (min)</label>
    <input type="number" id="openToProcedure" value="1" min="0" max="60">

    <label>Temps limite arrivée (min)</label>
    <input type="number" id="finishLimit" value="20" min="1" max="120">
  </div>

  <!-- BOUTON OUVERTURE LIGNE -->
  <button id="openBtn" onclick="openLine()">🚩 Ouvrir la ligne</button>

  <!-- ===================== -->
  <!-- APERÇU (retard)       -->
  <!-- Visible dès ouverture jusqu'à T0 -->
  <!-- ===================== -->
  <button id="btnApercu" class="btn-warning" onclick="sendApercu()" style="display:none;">
    ⚓ Aperçu — Retard de départ (2 sons)
  </button>

  <!-- AFFALÉE APERÇU -->
  <button id="btnAffaleeApercu" class="btn-warning" onclick="affaleeApercu()" style="display:none;">
    🔽 Affalée aperçu (1 son) → relance dans 1 min
  </button>

  <!-- ===================== -->
  <!-- BOUTONS COURSE        -->
  <!-- ===================== -->
  <div id="raceBtns" style="display:none;">

    <button id="btnRecallInd" onclick="recallIndividual()">
      🚩 Rappel individuel (1 son)
    </button>

    <button id="btnCancelRecallInd" class="btn-success" onclick="cancelRecallIndividual()" style="display:none;">
      ✅ Retirer rappel individuel (1 son)
    </button>

    <button id="btnRecallGen" onclick="recallGeneral()">
      🚨 Rappel général (2 sons)
    </button>

    <!-- Arrivée — visible seulement après fermeture de ligne -->
    <button id="btnFinish" class="btn-finish" onclick="finishRace()" style="display:none;">
      🏁 Arrivée (1 son)
    </button>

    <!-- Relancer procédure après annulation -->
    <button id="btnRestart" class="btn-warning" onclick="restartProcedure()" style="display:none;">
      🔄 Relancer une procédure
    </button>

  </div>

  <!-- LISTE ARRIVÉES -->
  <div id="finishList"></div>

  <!-- ===================== -->
  <!-- BOUTON OPTIONS        -->
  <!-- Caché pendant paramétrage, visible dès ouverture ligne -->
  <!-- ===================== -->
  <button id="btnOptions" class="btn-secondary" onclick="cancelAll()" style="display:none;">
    ⚙️ Options / Annuler
  </button>

  <!-- ===================== -->
  <!-- MENU OPTIONS          -->
  <!-- ===================== -->
  <div id="cancelMenu" class="panel panel-danger" style="display:none;">
    <h2>⚙️ Options</h2>

    <button class="btn-secondary" onclick="goToSetup()">
      🏠 Retour aux paramètres
    </button>

    <button class="btn-danger" onclick="cancelRace()">
      🚫 Annuler la course (Pav. N/A — 3 sons)
    </button>

    <button class="btn-danger" onclick="endRegatta()">
      🏴 Terminer la régate (Pav. N/A — 3 sons)
    </button>

    <!-- Visible seulement après fin/annulation -->
    <button id="menuRelancerCourse" class="btn-warning" onclick="relancerCourse()" style="display:none;">
      🔄 Relancer une course (repart de zéro)
    </button>

    <button class="btn-secondary" onclick="hideCancelMenu()">
      ↩️ Fermer ce menu
    </button>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
